<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shenil Shah | Data Analytics Portfolio</title><style>html,body{margin:0;background:#06111a;color:#eaf6fb;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}</style></head><body><div id="loading">Loading portfolio…</div><script>(async()=>{try{const files=['assets/p0.txt','assets/p1.txt','assets/p2.txt','assets/p3.txt','assets/p4.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div><h2>Portfolio loading error</h2><p>Please refresh this page.</p></div>'}})();</script></body></html>
