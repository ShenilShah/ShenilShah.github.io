<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Shenil Shah | Data Analytics Portfolio</title><style>html,body,#site{margin:0;width:100%;height:100%;min-height:100vh;background:#06111a}body{overflow:hidden}#site{display:block;border:0}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#06111a;color:#eaf6fb;font:16px Arial,sans-serif;z-index:2}</style></head>
<body><div id="loading">Loading portfolio…</div><iframe id="site" title="Shenil Shah Portfolio"></iframe>
<script>
(async()=>{try{
  const files=['assets/p0.txt','assets/p1.txt','assets/p2.txt','assets/p3.txt','assets/p4.txt'];
  const parts=await Promise.all(files.map(f=>fetch(f+'?v=98',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
  const b64=parts.join('').trim();
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  const cloud=`let saved=null;\ntry{\n const xhr=new XMLHttpRequest();\n xhr.open('GET',CLOUD_URL+'?t='+Date.now(),false);\n xhr.setRequestHeader('Cache-Control','no-cache');\n xhr.send(null);\n if(xhr.status>=200&&xhr.status<300){\n  const payload=JSON.parse(xhr.responseText||'{}');\n  if(payload&&payload.published&&payload.data)saved=payload.data;\n }\n}catch(err){console.error('Could not load published portfolio',err)}\nlet data=migrate(saved||clone(defaults));`;
  html=html.replace(/let saved=null;[\s\S]*?let data=migrate\(saved\);/,cloud);
  const frame=document.getElementById('site');
  frame.addEventListener('load',()=>{document.getElementById('loading')?.remove()},{once:true});
  frame.srcdoc=html;
}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div><h2>Portfolio loading error</h2><p>Please refresh this page.</p></div>'}})();
</script></body></html>
